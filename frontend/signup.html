<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign Up - RBMI Events</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>
  <div class="brand-wrap">
    <img src="../assets/images/logo.png" alt="Logo">
    <h2>RBMI Campus Events</h2>
  </div>

  <nav>
    <a href="./index.html">Home</a>
    <a href="./events.html">Events</a>
    <a href="./about.html">About</a>

    <a id="admin-events" href="admin-events.html">Manage Events</a>
    <a id="admin-data" href="admin-dashboard.html">View Registrations</a>

    <a id="nav-sign" href="./signup.html" class="active">Sign Up</a>
    <a id="nav-login" href="./login.html">Login</a>
  </nav>
</header>

<div class="top-accent"></div>

<section class="content">

  <div class="form-card">
    <h2 style="text-align:center;">Create Account</h2>

    <form id="signupForm">

      <label>Name</label>
      <input id="name" type="text" required />

      <label>Email</label>
      <input id="email" type="email" required />

      <label>Password</label>
      <input id="pwd" type="password" required />

      <button type="submit">Sign Up</button>

      <!-- 🔥 message -->
      <p id="signupMsg" style="margin-top:10px;"></p>

    </form>

  </div>

</section>

<footer>© 2025 RBMI | Campus Events Portal</footer>

<script>
document.getElementById("signupForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("pwd").value;

  try{
    const res = await fetch("http://127.0.0.1:5000/signup",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({name,email,password})
    });

    const data = await res.json();

    const msg = document.getElementById("signupMsg");

    if(res.status === 200){
      msg.style.color = "green";
      msg.textContent = "Signup successful";

      setTimeout(()=>{
        window.location.href = "login.html";
      },1000);

    } else {
      msg.style.color = "red";
      msg.textContent = "Signup failed";
    }

  }catch(err){
    document.getElementById("signupMsg").textContent = "Server error";
  }
});
</script>

<script src="../assets/js/auth.js"></script>

</body>
</html>
