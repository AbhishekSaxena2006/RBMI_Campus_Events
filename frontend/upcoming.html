<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Events - RBMI</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <style>
    .event-row {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .event-card {
      background: #fff;
      flex: 1;
      min-width: 48%;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      text-align: center;
      cursor: pointer;
    }

    .event-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 10px;
      background: #f2f2f2;
    }

    .event-card h4 {
      margin: 10px 0 4px;
      font-size: 18px;
      font-weight: 700;
      color: #0a3d62;
    }

    .event-card p {
      font-size: 14px;
      color: #444;
    }
  </style>

<header>
  <div class="brand-wrap">
    <img src="../assets/images/logo.png" alt="Logo">
    <h2>RBMI Campus Events</h2>
  </div>

  <nav>
  <a href="./index.html">Home</a>
  <a href="./events.html">Events</a>
  <a href="./about.html">About</a>

  <a id="nav-sign" href="./signup.html">Sign Up</a>
  <a id="nav-login" href="./login.html">Login</a>

  <!---ADMIN BUTTONS -->
  <a id="admin-events" href="admin-events.html" hidden>Manage Events</a>
<a id="admin-data" href="admin-dashboard.html" hidden>View Registrations</a>
</nav>

</header>

<div class="top-accent"></div>

<section class="content">
  <h2>Upcoming Events</h2>

  <!-- 🔥 EMPTY (dynamic load hoga) -->
  <div class="event-grid"></div>

</section>

<footer>© 2025 RBMI | Campus Events Portal</footer>

<script src="../assets/js/auth.js"></script>

<script>
function goToRegister(eventName) {
  window.location.href = "register.html?event=" + encodeURIComponent(eventName);
}

// 🔥 DYNAMIC EVENTS LOAD
async function loadEvents(){
  const res = await fetch("http://127.0.0.1:5000/get-events");
  const data = await res.json();

  const container = document.querySelector(".event-grid");
  container.innerHTML = "";

  data.forEach(e => {
    container.innerHTML += `
      <div class="event-card" onclick="goToRegister('${e[1]}')">
        <h4>${e[1]}</h4>
        <p>${e[2]}</p>
      </div>
    `;
  });
}

loadEvents();
</script>


<script>
if(localStorage.getItem("role") === "admin"){
  document.getElementById("admin-events").hidden = false;
  document.getElementById("admin-data").hidden = false;
}
</script>
</body>
</html>
